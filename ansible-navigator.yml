---
ansible-navigator:
  ansible:
    config:
      path: ansible.cfg
  execution-environment:
    image: aap.rh.lab/ee-infoblox-snow:1.0
    pull:
      policy: missing
    environment-variables:
      pass:
        - INFOBLOX_PORTAL_KEY
        - INFOBLOX_PORTAL_URL
        - SN_HOST
        - SN_USERNAME
        - SN_PASSWORD
        - CONTROLLER_HOST
        - CONTROLLER_OAUTH_TOKEN
  playbook-artifact:
    enable: false
  mode: stdout
