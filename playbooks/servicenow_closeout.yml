---
# servicenow.itsm reads SN_HOST, SN_USERNAME and SN_PASSWORD from the environment. AAP credential type:
#   inputs:
#     fields:
#       - {id: sn_host, type: string, label: ServiceNow instance URL}
#       - {id: sn_username, type: string, label: Username}
#       - {id: sn_password, type: string, label: Password, secret: true}
#     required: [sn_host, sn_username, sn_password]
#   injectors:
#     env:
#       SN_HOST: "{{ sn_host }}"
#       SN_USERNAME: "{{ sn_username }}"
#       SN_PASSWORD: "{{ sn_password }}"
- name: Close out ServiceNow request
  hosts: localhost
  gather_facts: false

  vars:
    # Defaults to failure so a node missing snow_outcome can never close a ticket.
    outcome: "{{ snow_outcome | default('failed_rolled_back', true) }}"
    # Only the decommission workflow launches with snow_fqdn; deletions are never rolled back.
    failure_line: >-
      {{ 'Deletions are never rolled back automatically, so Infoblox may be partially cleaned up. Request left open for review.'
         if snow_fqdn is defined
         else 'Nothing was changed in Infoblox: the automation rolled the request back. Request left open for review.' }}
    # Upstream jobs that die early publish no artifacts, so every artifact read below has a default.
    work_note_lines:
      - "[Ansible Automation]"
      - "{{ snow_ritm_number }}: {{ outcome }}"
      - "Requested by: {{ snow_requested_by }}"
      - "{{ snow_summary | default('Job failed before publishing details, see the AAP job output') }}"
      - "{{ 'Previous owner: ' ~ decom_owner if snow_fqdn is defined and decom_owner is defined else '' }}"
      - "{{ 'Rollback: ' ~ rollback_summary | default('no rollback details published') if outcome != 'success' and snow_fqdn is not defined else '' }}"
      - "{{ failure_line if outcome != 'success' else '' }}"

  tasks:
    - name: Update {{ snow_ritm_number }}
      servicenow.itsm.api:
        resource: sc_req_item
        action: patch
        sys_id: "{{ snow_ritm_sys_id }}"
        data: "{{ {'work_notes': work_note_lines | select | join('\n\n')} | combine({'state': '3'} if outcome == 'success' else {}) }}"
