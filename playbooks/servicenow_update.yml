---
- name: Note ServiceNow request progress
  hosts: localhost

  vars:
    # RITM notes definitions
    outcome: "{{ snow_outcome | default('failed_rolled_back', true) }}"
    failure_line: >-
      {{ 'Deletions are not rolled back automatically so request may be in partially cleaned up state. Request left open for review.'
         if snow_fqdn is defined
         else 'Nothing was changed in Infoblox: the automation rolled the request back. Request left open for review.' }}
    start_note:
      - "[Ansible Automation]"
      - "{{ snow_ritm_number }}: started"
      - "Requested by: {{ snow_requested_by }}"
      - "AAP is running the {{ 'decommission' if snow_fqdn is defined else 'provisioning' }} workflow for {{ snow_fqdn | default(snow_hostname) }}"
    result_note:
      - "[Ansible Automation]"
      - "{{ snow_ritm_number }}: {{ outcome }}"
      - "Requested by: {{ snow_requested_by }}"
      - "{{ snow_summary | default('Job failed before publishing details, see the AAP job output') }}"
      - "{{ 'Previous owner: ' ~ decom_owner if snow_fqdn is defined and decom_owner is defined else '' }}"
      - "{{ 'Rollback: ' ~ rollback_summary | default('no rollback details published') if outcome != 'success' and snow_fqdn is not defined else '' }}"
      - "{{ failure_line if outcome != 'success' else '' }}"
    work_note_lines: "{{ start_note if outcome == 'started' else result_note }}"

  tasks:
    - name: Update {{ snow_ritm_number }}
      servicenow.itsm.api:
        resource: sc_req_item
        action: patch
        sys_id: "{{ snow_ritm_sys_id }}"
        data: "{{ {'work_notes': work_note_lines | select | join('\n\n')} | combine({'state': '3'} if outcome == 'success' else {}) }}"
